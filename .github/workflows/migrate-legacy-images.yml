name: Migrate legacy article images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-legacy-images.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Copy images into this repository and rewrite links
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote, quote
          import re
          import urllib.request
          import shutil

          root = Path(".").resolve()
          workflow_path = Path(".github/workflows/migrate-legacy-images.yml")
          markdown_files = [p for p in root.rglob("*.md") if ".git" not in p.parts and "node_modules" not in p.parts]

          md_image = re.compile(r'(?P<prefix>!\[[^\]]*\]\()(?P<url>https?://github\.com/0xSix9/[^)\s]+)(?P<suffix>\))', re.IGNORECASE)
          html_image = re.compile(r'(?P<prefix><img\b[^>]*?\bsrc=["\'])(?P<url>https?://github\.com/0xSix9/[^"\']+)(?P<suffix>["\'])', re.IGNORECASE)

          refs = {}
          contents = {}
          for file in markdown_files:
              text = file.read_text(encoding="utf-8")
              contents[file] = text
              for pattern in (md_image, html_image):
                  for match in pattern.finditer(text):
                      url = match.group("url")
                      parsed = urlsplit(url)
                      parts = [unquote(p) for p in parsed.path.strip("/").split("/")]
                      if len(parts) < 5 or parts[0].lower() != "0xsix9" or parts[2].lower() != "blob":
                          continue
                      repo, ref = parts[1], parts[3]
                      source_path = "/".join(parts[4:])
                      if not source_path or source_path.startswith("../") or "/../" in source_path:
                          raise RuntimeError(f"Unsafe image path in {file}: {url}")
                      key = (repo, source_path, ref)
                      refs.setdefault(key, []).append((file, url))

          if not refs:
              raise RuntimeError("No image links to legacy 0xSix9 repositories were found; nothing was changed.")

          # Keep versions separate if the same source path is referenced at different refs.
          ref_versions = {}
          for repo, source_path, ref in refs:
              ref_versions.setdefault((repo, source_path), set()).add(ref)

          replacements = {}
          copied = set()
          for (repo, source_path, ref), usages in refs.items():
              if len(ref_versions[(repo, source_path)]) == 1:
                  target_rel = Path("assets") / repo / Path(source_path)
              else:
                  target_rel = Path("assets") / repo / "_versions" / ref / Path(source_path)
              target = root / target_rel
              target.parent.mkdir(parents=True, exist_ok=True)

              raw_path = quote(source_path, safe="/")
              raw_url = f"https://raw.githubusercontent.com/0xSix9/{quote(repo, safe='')}/{quote(ref, safe='')}/{raw_path}"
              request = urllib.request.Request(raw_url, headers={"User-Agent": "Blockchain-Concepts-image-migration"})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response, target.open("wb") as out:
                      shutil.copyfileobj(response, out)
              except Exception as exc:
                  raise RuntimeError(f"Could not download {raw_url}: {exc}") from exc

              copied.add(target_rel.as_posix())
              for file, old_url in usages:
                  rel = Path(__import__("os").path.relpath(target_rel, start=file.parent))
                  new_url = quote(rel.as_posix(), safe="/._-")
                  replacements.setdefault(file, {})[old_url] = new_url

          changed_files = 0
          for file, text in contents.items():
              new_text = text
              for pattern in (md_image, html_image):
                  def replace(match):
                      old_url = match.group("url")
                      new_url = replacements.get(file, {}).get(old_url)
                      if not new_url:
                          return match.group(0)
                      return match.group("prefix") + new_url + match.group("suffix")
                  new_text = pattern.sub(replace, new_text)
              if new_text != text:
                  file.write_text(new_text, encoding="utf-8")
                  changed_files += 1

          root_readme = root / "README.md"
          if root_readme.exists():
              text = root_readme.read_text(encoding="utf-8")
              text = text.replace(
                  "- Some diagrams/images are linked from their original repositories so that they remain viewable without duplicating large binary assets here.",
                  "- Article images and diagrams are stored inside this repository, so the consolidated articles do not depend on the original repositories."
              )
              root_readme.write_text(text, encoding="utf-8")

          # Remove this one-time migration workflow from the finished repository.
          if workflow_path.exists():
              workflow_path.unlink()

          print(f"Copied {len(copied)} unique image assets.")
          print(f"Updated {changed_files} Markdown files.")
          for item in sorted(copied):
              print(f"ASSET {item}")
          PY

      - name: Commit migrated images and links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 1
          fi
          git commit -m "Make article images self-contained"
          git push
