<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Signature binding and verification</title>
  <desc id="desc">Execution-critical fields and domain information are hashed into a digest; signatures are verified for distinct authorized signers and threshold.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#20242b"/></marker>
    <style>
      .bg{fill:#fff}.title{font:700 29px Arial,sans-serif;fill:#111827}.sub{font:16px Arial,sans-serif;fill:#4b5563}
      .box{fill:#fff;stroke:#20242b;stroke-width:2}.accent{fill:#f3f4f6;stroke:#111827;stroke-width:2.5}
      .label{font:700 18px Arial,sans-serif;fill:#111827}.small{font:15px Arial,sans-serif;fill:#4b5563}
      .line{fill:none;stroke:#20242b;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="690" rx="22"/>
  <text x="54" y="56" class="title">What exactly does an owner approve?</text>
  <text x="54" y="84" class="sub">A signature must bind to the full operation and its intended signing domain.</text>

  <rect x="55" y="125" width="490" height="205" rx="16" class="box"/>
  <text x="82" y="160" class="label">Operation fields</text>
  <text x="82" y="194" class="small">to · value · calldata</text>
  <text x="82" y="222" class="small">operation type · nonce</text>
  <text x="82" y="250" class="small">deadline and execution-critical options</text>
  <text x="82" y="296" class="small">Changing a signed field must change the digest.</text>

  <rect x="655" y="125" width="490" height="205" rx="16" class="box"/>
  <text x="682" y="160" class="label">Signing domain (EIP-712)</text>
  <text x="682" y="194" class="small">name / version (where used)</text>
  <text x="682" y="222" class="small">chainId · verifyingContract</text>
  <text x="682" y="250" class="small">Other domain fields where appropriate</text>
  <text x="682" y="296" class="small">Domain separation is not replay protection.</text>

  <path d="M300 330 V367 H475 V390" class="line"/>
  <path d="M900 330 V367 H725 V390" class="line"/>
  <rect x="360" y="390" width="480" height="78" rx="15" class="accent"/>
  <text x="600" y="421" text-anchor="middle" class="label">Typed-data digest</text>
  <text x="600" y="447" text-anchor="middle" class="small">Hash of operation + domain</text>
  <path d="M600 468 V500" class="line"/>

  <rect x="360" y="500" width="480" height="74" rx="15" class="box"/>
  <text x="600" y="530" text-anchor="middle" class="label">Verify each approval</text>
  <text x="600" y="553" text-anchor="middle" class="small">Authorized owner · valid format · distinct signer</text>
  <path d="M600 574 V602" class="line"/>
  <rect x="360" y="602" width="480" height="54" rx="14" fill="#111827"/>
  <text x="600" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Count valid owners → enforce threshold</text>
</svg>