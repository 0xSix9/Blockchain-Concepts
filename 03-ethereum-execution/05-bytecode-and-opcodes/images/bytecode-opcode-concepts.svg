<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Bytecode, opcode byte, mnemonic and disassembler</title><desc id="desc">Compares the byte sequence, a single opcode byte, a readable mnemonic, and the tool that disassembles bytecode.</desc>
<rect width="1400" height="600" rx="28" fill="#F5F7FB"/><rect x="34" y="28" width="1332" height="544" rx="24" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
<text x="700" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Four Terms That Should Not Be Confused</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="80" y="132" width="570" height="150" rx="18" fill="#ECFDF5" stroke="#86D6B5" stroke-width="2"/><text x="365" y="171" font-size="25" font-weight="700" fill="#047857">Bytecode</text><text x="365" y="206" font-size="18" fill="#3F6D61">A sequence of bytes</text><text x="365" y="245" font-family="monospace" font-size="25" fill="#243044">0x6002600301</text><text x="365" y="266" font-size="15" fill="#64748B">Often displayed in hexadecimal</text>
<rect x="750" y="132" width="570" height="150" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="1035" y="171" font-size="25" font-weight="700" fill="#1D4ED8">Opcode byte</text><text x="1035" y="206" font-size="18" fill="#475569">The encoded value for an instruction</text><text x="1035" y="245" font-family="monospace" font-size="25" fill="#243044">0x01 → ADD</text><text x="1035" y="266" font-size="15" fill="#64748B">In the EVM instruction set</text>
<path d="M365 291 V322 H700 V342 M1035 291 V322 H700" fill="none" stroke="#64748B" stroke-width="2.5"/>
<rect x="210" y="351" width="980" height="155" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/><text x="700" y="391" font-size="25" font-weight="700" fill="#6D28D9">Mnemonic and Disassembler</text><text x="700" y="430" font-size="19" fill="#5B5670">Mnemonic = the readable instruction name, such as ADD or PUSH1</text><text x="700" y="464" font-size="19" fill="#5B5670">Disassembler = a tool that interprets bytecode and displays instructions</text>
<text x="700" y="540" font-size="17" fill="#64748B">Hex is a notation for bytes · An opcode byte encodes an instruction · A mnemonic names it</text>
</g></svg>