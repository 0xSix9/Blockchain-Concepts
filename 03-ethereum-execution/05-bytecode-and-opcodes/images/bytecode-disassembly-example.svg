<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Disassembling 0x6002600301</title><desc id="desc">Five bytes are classified into two PUSH1 instructions and one ADD instruction.</desc>
<rect width="1400" height="700" rx="28" fill="#F5F7FB"/><rect x="34" y="28" width="1332" height="644" rx="24" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
<text x="700" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">From Hex Bytes to EVM Instructions</text>
<text x="700" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#64748B">Example bytecode: 0x6002600301</text>
<text x="700" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#64748B">FIVE BYTES IN THE HEX STRING</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="220" y="198" font-size="15" fill="#64748B">Offset 0</text><text x="420" y="198" font-size="15" fill="#64748B">Offset 1</text><text x="620" y="198" font-size="15" fill="#64748B">Offset 2</text><text x="820" y="198" font-size="15" fill="#64748B">Offset 3</text><text x="1020" y="198" font-size="15" fill="#64748B">Offset 4</text>
</g>
<g font-family="monospace" text-anchor="middle">
<rect x="150" y="214" width="140" height="80" rx="13" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/><text x="220" y="249" font-size="30" font-weight="700" fill="#1D4ED8">60</text><text x="220" y="276" font-family="Arial,sans-serif" font-size="14" fill="#1E40AF">Opcode byte</text>
<rect x="350" y="214" width="140" height="80" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="420" y="249" font-size="30" font-weight="700" fill="#92400E">02</text><text x="420" y="276" font-family="Arial,sans-serif" font-size="14" fill="#92400E">Immediate data</text>
<rect x="550" y="214" width="140" height="80" rx="13" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/><text x="620" y="249" font-size="30" font-weight="700" fill="#1D4ED8">60</text><text x="620" y="276" font-family="Arial,sans-serif" font-size="14" fill="#1E40AF">Opcode byte</text>
<rect x="750" y="214" width="140" height="80" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="820" y="249" font-size="30" font-weight="700" fill="#92400E">03</text><text x="820" y="276" font-family="Arial,sans-serif" font-size="14" fill="#92400E">Immediate data</text>
<rect x="950" y="214" width="140" height="80" rx="13" fill="#D1FAE5" stroke="#34D399" stroke-width="2"/><text x="1020" y="249" font-size="30" font-weight="700" fill="#047857">01</text><text x="1020" y="276" font-family="Arial,sans-serif" font-size="14" fill="#047857">Opcode byte</text>
</g>
<path d="M220 300 V323 H420 V300 M620 300 V323 H820 V300" fill="none" stroke="#64748B" stroke-width="2.5"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="130" y="341" width="380" height="84" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/><text x="320" y="374" font-size="22" font-weight="700" fill="#1D4ED8">PUSH1 0x02</text><text x="320" y="403" font-size="16" fill="#475569">60 = opcode · 02 = data</text>
<rect x="530" y="341" width="380" height="84" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/><text x="720" y="374" font-size="22" font-weight="700" fill="#1D4ED8">PUSH1 0x03</text><text x="720" y="403" font-size="16" fill="#475569">60 = opcode · 03 = data</text>
<rect x="950" y="341" width="140" height="84" rx="13" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/><text x="1020" y="374" font-size="23" font-weight="700" fill="#047857">ADD</text><text x="1020" y="403" font-size="16" fill="#475569">01 = opcode</text>
</g>
<path d="M320 429 V455 H700 M720 429 V455 H700 M1020 429 V455 H700 V472" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="5 5"/>
<rect x="130" y="474" width="1140" height="94" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
<text x="700" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#5B21B6">Disassembled instruction stream</text><text x="700" y="543" text-anchor="middle" font-family="monospace" font-size="22" fill="#334155">Offset 0: PUSH1 0x02   |   Offset 2: PUSH1 0x03   |   Offset 4: ADD</text>
<text x="700" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748B">PUSH1 occupies two bytes: one opcode byte plus one immediate data byte.</text></svg>