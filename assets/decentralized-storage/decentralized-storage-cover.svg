<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Decentralized Storage — The Data Layer of Web3</title>
  <desc id="desc">A dark technical illustration of independent storage nodes connected through a peer-to-peer network, representing IPFS, Filecoin, and content-addressed data.</desc>
